name: Rheinland Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node24-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and module checks
        run: npm run check
